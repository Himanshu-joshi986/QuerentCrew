[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "querentcrew"
version = "1.0.0"
description = "Multi-agent analytics assistant built with LangChain 1.x and LangGraph"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Himanshu Joshi" }]

[project.scripts]
querentcrew = "querentcrew.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
querentcrew = ["prompts/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
